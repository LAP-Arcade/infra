- hosts: jarvis
  become: true
  vars:
    freebox_dir: /opt/freebox
    quadlets:
      homeassistant:
        image: ghcr.io/home-assistant/home-assistant
        tag: stable
        scope: system
        memory_high: 3G
        memory_max: 4G
        memory_swap_max: 1G
        volumes:
          - /etc/homeassistant:/config
          - /var/run/dbus/system_bus_socket:/run/dbus/system_bus_socket
          - /media/cctv:/media/cctv:Z
        cap_add:
          - NET_ADMIN
          - NET_RAW
        env:
          TZ: Europe/Paris
        network: host
        podman: --privileged
      matter_server:
        image: ghcr.io/matter-js/matterjs-server
        tag: stable
        scope: system
        user: root
        exec: |-
          --storage-path /data
          --listen-address 127.0.0.1
          --primary-interface enp1s0
        exec_pre: |
          find /etc/matter-server -name '*.json.gz' -size 0 -print -delete;
        volumes:
          - /etc/matter-server:/data:Z
          - /run/dbus:/run/dbus:ro
        network: host
      mosquitto:
        image: docker.io/library/eclipse-mosquitto
        tag: "2"
        scope: system
        entrypoint: /mosquitto/config/entrypoint.sh
        env_file: /etc/mosquitto/env
        volumes:
          - /etc/mosquitto/config:/mosquitto/config:Z
          - /etc/mosquitto/data:/mosquitto/data:Z
        network: host
      caddy:
        image: docker.io/library/caddy
        tag: "2"
        scope: system
        volumes:
          - /etc/caddy:/etc/caddy:Z
          - /var/lib/caddy:/data/caddy:Z
          - /var/log/caddy:/var/log/caddy:Z
          - /srv/www:/srv/www:ro,Z
        network: host
      restreamer:
        image: datarhei/restreamer
        tag: vaapi-latest
        scope: system
        podman: --privileged
        volumes:
          - /dev/dri:/dev/dri:Z
          - /etc/restreamer:/core/config:Z
          - /usr/local/share/restreamer:/core/data:Z
          - /media/cctv:/media/cctv:Z
        ports:
          - 8080:8080
          - 8181:8181
          - 1935:1935
          - 1936:1936
          - 6000:6000/udp
        enabled: false
        state: stopped
      # shinobi:
      #   image: registry.gitlab.com/shinobi-systems/shinobi
      #   tag: dev
      #   scope: system
      #   volumes:
      #     - /usr/local/share/shinobi/database:/var/lib/mysql:Z
      #     - /usr/local/share/shinobi/data:/home/Shinobi:Z
      #     - /dev/shm/shinobiStreams:/dev/shm/streams:Z
      #     - /etc/localtime:/etc/localtime:ro
      #     - /media/cctv:/media/cctv:Z
      #   ports:
      #     - 8080:8080
        # network: host
      frigate:
        image: ghcr.io/blakeblackshear/frigate
        tag: stable
        scope: system
        shm_size: 256m
        podman: --privileged
        devices:
          - /dev/dri/renderD128
        volumes:
          - /etc/localtime:/etc/localtime:ro
          - /etc/frigate:/config:Z
          - /media/cctv:/media/frigate:Z
        tmpfs:
          - /tmp/cache:size=1000000000
        env:
          TZ: Europe/Paris
        env_file: /etc/frigate/env
        ports:
          - 8971:8971
          # - 8554:8554
          # - 8555:8555/tcp
          # - 8555:8555/udp
  tasks:
    - name: Configure hostname
      hostname:
        name: jarvis

    - name: Configure system locale
      block:
        - name: Install locale package
          package:
            name: glibc-langpack-en
            state: present
        - name: Set system locale
          command: "localectl set-locale LANG={{ locale }}"
          when: ansible_env.LANG | default('') != locale
      tags: locale
      vars:
        locale: en_US.UTF-8

    - name: Restore SELinux contexts on host-shared paths
      # -F because container_file_t is a customizable type, skipped otherwise
      command: "restorecon -F -v {{ item }}"
      loop:
        - /etc/localtime
      register: restorecon
      changed_when: restorecon.stdout | length > 0
      tags: selinux

    - include_role:
        name: kernel
        apply:
          tags: kernel
      tags: always
      vars:
        kernel_args:
          - systemd.tpm2_wait=false
          - psi=1 # for systemd-oomd
        kernel_sysctls:
          kernel.panic: 10
          kernel.panic_on_oops: 1
        kernel_swap_size: 4G

    - include_role:
        name: journal
        apply:
          tags: journal
      tags: always

    - include_role:
        name: watchdog
        apply:
          tags: watchdog
      tags: always

    - name: Install packages
      package:
        name: "{{ packages }}"
        state: present
      vars:
        packages:
          - htop
          - ncdu
          - opentofu
      tags: packages
    - name: Remove packages
      package:
        name: "{{ packages }}"
        state: absent
      vars:
        packages:
          - langpacks-core-fr
          - glibc-langpack-fr
      tags: packages

    - include_role:
        name: firewall
        apply:
          tags: firewall
      tags: firewall
      vars:
        firewall_services:
          - ssh
          - cockpit
          - dhcpv6-client
          - dns
          - mdns # needed for Matter device discovery
          - http
        firewall_ports:
          - "{{ ports.mqtt }}/tcp"

    - include_role:
        name: wireguard
        apply:
          tags: wireguard
      tags: always

    - include_role:
        name: mosquitto

    - name: Deploy /srv/www
      synchronize:
        src: www/
        dest: /srv/www/
        recursive: true
        delete: true
        rsync_opts:
          - "--chmod=Du=rwx,Dg=rx,Do=rx,Fu=rw,Fg=r,Fo=r"
      tags: www

    - name: Deploy Freebox tooling
      tags: freebox
      block:
        - name: Create Freebox tooling directory
          file:
            path: "{{ freebox_dir }}"
            state: directory
            mode: u=rwx,g=rx,o=

        - name: Synchronize Freebox tooling
          synchronize:
            src: terraform/freebox/
            dest: "{{ freebox_dir }}/"
            recursive: true
            delete: true
            rsync_opts:
              - "--exclude=.env"
              - "--exclude=.venv"
              - "--exclude=bin"
              - "--exclude=.terraform*"

        - name: Check for Freebox secrets file
          stat:
            path: "{{ freebox_dir }}/.env"
          register: freebox_env

        - name: Restrict Freebox secrets file
          file:
            path: "{{ freebox_dir }}/.env"
            owner: root
            group: root
            mode: u=rw,g=,o=
          when: freebox_env.stat.exists

        - name: Create Discord VPN bot service
          include_role:
            name: common
            tasks_from: create_service
          vars:
            service_name: discord-vpn-bot
            service_description: Discord bot managing the Freebox VPN users
            service_workdir: "{{ freebox_dir }}"
            service_script: |
              {{ python_setup }}
              ./setup.sh
              set -a
              source .env
              set +a
              tofu init -input=false
              exec python discord_bot.py
            service_state: stopped
            service_enabled: false

        - name: Create Freebox DNS enforcement service
          include_role:
            name: common
            tasks_from: create_service
          vars:
            service_name: force-freebox-dns
            service_description: Reset the Freebox DNS servers when they change
            service_workdir: "{{ freebox_dir }}"
            service_script: |
              {{ python_setup }}
              exec python force_dns_servers.py
            service_state: stopped
            service_enabled: false

    - include_role:
        name: frigate
        apply:
          tags: frigate
      tags: always
      vars:
        frigate_streams:
          - "rtsp://mottie:{FRIGATE_RTSP_PASSWORD}@dojo.cam:554/stream2"
          - "rtsp://mottie:{FRIGATE_RTSP_PASSWORD}@octogone.cam:554/stream2"
    - include_role:
        name: containers
        apply:
          tags: containers
      tags: always

    - include_role:
        name: caddy
        apply:
          tags: caddy
      tags: always
      vars:
        caddy_https: false
        caddy_prometheus: false
        caddy_command: >-
          podman run --rm --security-opt label=disable
          -v /etc/caddy:/etc/caddy caddy:{{ quadlets.caddy.tag }} caddy
        http_domain: false
        caddy_entries:
          - domain: ha.jarvis.lan
            file: homeassistant
            reverses:
              - to: localhost:{{ ports.homeassistant }}
          - domain: jarvis.lan
            file: jarvis
            root: /srv/www/jarvis.lan

    - include_role:
        name: homeassistant
        apply:
          tags: homeassistant
      tags: always

    - include_role:
        name: dnsmasq
        apply:
          tags: dnsmasq
      tags: always
      vars:
        dns_local_suffixes:
          - lan
          - cam
        dns_servers:
          # - 192.168.0.1 # UDR
          - 8.8.8.8

    - include_role:
        name: hosts
        apply:
          tags: hosts
      tags: always
      vars:
        hosts_map:
          # UDR LAN
          192.168.0.1: udr.lan
          192.168.0.81: ganymede.lan
          192.168.0.98: octogone.lan
          192.168.0.154: octogone.cam
          192.168.0.179: astro.lan
          192.168.0.199: wacca-mythos.lan
          192.168.0.211: dojo.cam
          # 192.168.0.193: jarvis.lan ha.jarvis.lan
          # Freebox LAN
          192.168.1.148: jarvis.lan ha.jarvis.lan
          192.168.1.254: freebox.lan
          # VPN LAN
          192.168.27.65: jarvis.lan ha.jarvis.lan
        hosts_map_to_delete:
          192.168.27.65: jarvis.vpn.lan

    - name: Resolve through the local dnsmasq
      tags: dns
      block:
        - name: Read current enp1s0 resolver settings
          command: >-
            nmcli -g ipv4.dns,ipv4.ignore-auto-dns,ipv6.dns,ipv6.ignore-auto-dns
            connection show enp1s0
          register: enp1s0_dns
          changed_when: false

        - name: Point enp1s0 at the local dnsmasq
          when: enp1s0_dns.stdout_lines != ["127.0.0.1", "yes", "::1", "yes"]
          block:
            - name: Set enp1s0 resolvers
              command: >-
                nmcli connection modify enp1s0
                ipv4.dns 127.0.0.1 ipv4.ignore-auto-dns yes
                ipv6.dns ::1 ipv6.ignore-auto-dns yes

            - name: Reapply enp1s0 to regenerate /etc/resolv.conf
              command: nmcli device reapply enp1s0
